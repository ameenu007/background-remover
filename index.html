<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Background Remover</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        width: min(92%, 600px);
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    h1 {
        margin-top: 0;
        color: #222;
    }

    p {
        color: #666;
    }

    .upload-box {
        margin: 25px 0;
        padding: 40px 20px;
        border: 2px dashed #aaa;
        border-radius: 15px;
        cursor: pointer;
        transition: .2s;
    }

    .upload-box:hover {
        border-color: #667eea;
        background: #f7f7ff;
    }

    input {
        display: none;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
    }

    button:hover {
        background: #5568d9;
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    #preview {
        max-width: 100%;
        max-height: 400px;
        margin-top: 20px;
        border-radius: 10px;
        display: none;
    }

    #download {
        display: none;
        background: #28a745;
    }

    #status {
        margin: 15px 0;
        color: #555;
    }
</style>
</head>

<body>

<div class="container">

    <h1>✂️ Background Remover</h1>

    <p>Upload an image and remove its background.</p>

    <label class="upload-box" for="imageInput">
        📷<br><br>
        Click here to choose an image
    </label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <div>
        <button id="removeBtn" disabled>
            Remove Background
        </button>

        <button id="download">
            Download PNG
        </button>
    </div>

    <p id="status"></p>

    <img id="preview" alt="Result">

</div>

<script>

const imageInput = document.getElementById("imageInput");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("download");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");

let selectedFile = null;
let resultBlob = null;

imageInput.addEventListener("change", function() {

    selectedFile = this.files[0];

    if (!selectedFile) {
        removeBtn.disabled = true;
        return;
    }

    removeBtn.disabled = false;

    statusText.textContent =
        "Selected: " + selectedFile.name;

    const reader = new FileReader();

    reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";
    };

    reader.readAsDataURL(selectedFile);
});


removeBtn.addEventListener("click", async function() {

    if (!selectedFile) return;

    removeBtn.disabled = true;
    statusText.textContent =
        "Removing background...";

    /*
        IMPORTANT:

        Replace YOUR_API_KEY with your actual
        background-removal API key.

        Example API:
        remove.bg
    */

    const formData = new FormData();

    formData.append("image_file", selectedFile);

    try {

        const response = await fetch(
            "https://api.remove.bg/v1.0/removebg",
            {
                method: "POST",

                headers: {
                    "X-Api-Key": "YOUR_API_KEY"
                },

                body: formData
            }
        );

        if (!response.ok) {
            throw new Error(
                "Background removal failed."
            );
        }

        resultBlob = await response.blob();

        const resultURL =
            URL.createObjectURL(resultBlob);

        preview.src = resultURL;

        statusText.textContent =
            "Background removed successfully!";

        downloadBtn.style.display =
            "inline-block";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Something went wrong. Check your API key.";
    }

    removeBtn.disabled = false;
});


downloadBtn.addEventListener("click", function() {

    if (!resultBlob) return;

    const url =
        URL.createObjectURL(resultBlob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = "background-removed.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
});

</script>

</body>
</html>
